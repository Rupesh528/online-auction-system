<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bootstrap Example</title>

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>
	<body class="bg-light">
		<div class="container-md bg-info p-1">
			<h3>
				This is full width on small screens, but centered on medium+ screens.
			</h3>
			<div class="bg-warning mx-5 my-3 p-3">
				<p>Margin horizontally (left & right) and vertically (top & bottom).</p>
			</div>
		</div>

		<div class="bg-warning mx-5 my-3 p-3">
			<p>Margin horizontally (left & right) and vertically (top & bottom).</p>
		</div>

		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
